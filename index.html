<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#143d48"><meta name="description" content="Private class-based OMR & writing marking tool with Excel results"><title>PaperMark • English assessment</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><style>
:root{color-scheme:light;--ink:#162e36;--muted:#697b82;--accent:#14766e;--accent-dark:#0e605a;--sand:#f5f6f1;--paper:#fff;--border:#dce5e2;--good:#147d57;--bad:#c14e43;--gold:#eab65b;--soft:#eff7f4;--shadow:0 15px 36px rgba(20,56,54,.065)}*{box-sizing:border-box}body{margin:0;background:var(--sand);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:1240px;margin:auto;display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.side{background:#113941;color:#e4f2ec;padding:32px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:12px;padding:6px 10px;font-size:20px;font-weight:800;letter-spacing:-.04em}.logo{width:35px;height:35px;border-radius:12px;display:grid;place-items:center;color:#0d3c39;background:#d4efdc;font-size:22px}.side nav{display:grid;gap:6px}.nav{color:#c2d8d6;background:none;border:0;text-align:left;padding:13px 14px;border-radius:12px;font-size:14px;font-weight:600;display:flex;gap:12px;align-items:center}.nav:hover,.nav.active{background:#28535a;color:white}.side-bottom{margin-top:auto;padding:14px 12px;background:#22505a;border-radius:14px;font-size:12px;line-height:1.5;color:#b9d1d0}.content{padding:34px clamp(16px,3.5vw,48px) 90px;min-width:0}.topbar{display:flex;align-items:start;justify-content:space-between;gap:15px;margin-bottom:27px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.17em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(25px,3vw,36px);line-height:1.1;letter-spacing:-.05em;margin:9px 0 4px;font-weight:800}h2{font-size:19px;letter-spacing:-.03em;margin:0 0 14px}h3{font-size:16px;margin:0 0 12px}.subtitle{color:var(--muted);font-size:14px;line-height:1.6}.card{background:var(--paper);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:18px;padding:24px;min-width:0}.card+.card{margin-top:16px}.grid{display:grid;gap:16px}.cols2{grid-template-columns:1fr 1fr}.cols3{grid-template-columns:repeat(3,1fr)}.stat{padding:23px}.stat .value{font-size:33px;font-weight:800;letter-spacing:-.055em;margin-top:9px}.stat .label{color:var(--muted);font-size:13px}.btn{border:1px solid var(--border);padding:11px 16px;border-radius:11px;color:var(--ink);background:white;font-weight:700;font-size:13px;display:inline-flex;gap:8px;align-items:center;justify-content:center;min-height:43px;white-space:nowrap}.btn:hover{border-color:#86bab1}.btn.primary{color:#fff;background:var(--accent);border-color:var(--accent)}.btn.primary:hover{background:var(--accent-dark)}.btn.ghost{background:transparent}.btn.danger{color:var(--bad);border-color:#f2cccc;background:#fff5f4}.btn.sm{font-size:12px;padding:7px 10px;min-height:34px}.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.actions.end{justify-content:flex-end}.row{display:flex;justify-content:space-between;align-items:center;gap:14px}.row.wrap{flex-wrap:wrap}.field{display:grid;gap:7px;font-size:12px;font-weight:800;color:#456069;min-width:0}.input,select,textarea{width:100%;border-radius:11px;border:1px solid #cadad5;padding:11px 12px;background:white;color:#152f36;outline-color:#2b9285;min-width:0}textarea{resize:vertical;min-height:100px;line-height:1.5}.pill{display:inline-flex;align-items:center;padding:5px 10px;font-size:11px;font-weight:800;border-radius:30px;background:#eff4f2;color:#476260;white-space:nowrap}.pill.completed{background:#ddf5e9;color:#17684c}.pill.incomplete{background:#fff3d9;color:#835910}.pill.absent{background:#fce9e7;color:#a8463d}.pill.missing{background:#eef1f2;color:#677478}.notice{padding:13px 16px;border-radius:12px;background:#eff9f4;color:#236353;font-size:13px;line-height:1.55;border:1px solid #d8ede3}.notice.warn{background:#fff8e6;border-color:#f4e2b1;color:#796027}.notice.error{background:#ffefee;border-color:#f2d0cc;color:#963e39}.divider{border:0;border-top:1px solid #e3ebe8;margin:18px 0}.stack{display:grid;gap:14px}.hide{display:none!important}.tablewrap{overflow:auto;border:1px solid #e0e8e5;border-radius:13px}.table{border-collapse:collapse;width:100%;min-width:650px;font-size:13px}.table th{text-transform:uppercase;font-size:10px;letter-spacing:.1em;color:#74848b;background:#f5f8f6;text-align:left;white-space:nowrap}.table td,.table th{padding:13px 12px;border-bottom:1px solid #eaf0ed;vertical-align:middle}.table tr:last-child td{border-bottom:0}.table tr:hover td{background:#fbfdfb}.check{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}.flow{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}.flow span{font-size:11px;font-weight:800;color:#7b8c8e;border:1px solid var(--border);padding:8px 10px;border-radius:20px}.flow .on{background:#173e46;color:white;border-color:#173e46}.upload{display:grid;place-items:center;gap:10px;border:2px dashed #b4c8c1;padding:30px 20px;border-radius:16px;text-align:center;background:#f9fcfa}.upload strong{font-size:16px}.upload small{color:var(--muted)}.capture{width:100%;max-height:640px;object-fit:contain;border-radius:14px;background:#e7eeeb}.canvasbox{position:relative;border-radius:12px;overflow:hidden;background:#e9efed;max-width:100%;display:flex;justify-content:center;align-items:center}.canvasbox canvas{max-width:100%;height:auto;touch-action:none;display:block}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}.seg{display:inline-flex;background:#e9f1ee;border-radius:10px;padding:4px;gap:3px}.seg button{border:0;border-radius:8px;padding:9px 12px;background:transparent;font-size:12px;font-weight:800;color:#55716a}.seg button.on{background:white;color:#0d625d;box-shadow:0 1px 4px #0001}.answers{display:grid;gap:10px}.answer{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px solid #e1e9e6;border-radius:12px}.answer .qno{color:var(--muted);font-weight:800;min-width:30px}.answer .qword{font-size:15px;font-weight:800;flex:1}.markbuttons{display:flex;gap:7px}.markbuttons button{width:48px;height:41px;background:#f3f6f5;border:1px solid #dce5e0;border-radius:9px;font-size:19px;font-weight:800}.markbuttons .yes.on{background:#d7f4e2;color:#16724a;border-color:#76c29e}.markbuttons .no.on{background:#ffe5e0;color:#b84940;border-color:#e9aa9d}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.photo-thumb{position:relative;aspect-ratio:3/4;background:#e4ebe8;border-radius:11px;overflow:hidden}.photo-thumb img{width:100%;height:100%;object-fit:cover}.photo-thumb button{position:absolute;right:6px;top:6px;border:none;border-radius:50%;background:#d64242;color:white;width:25px;height:25px}.progress{height:9px;border-radius:30px;background:#e7efeb;overflow:hidden}.progress>div{height:100%;background:var(--accent);transition:width .2s}.scorebig{font-weight:800;font-size:39px;letter-spacing:-.05em}.kbd{font:12px ui-monospace,monospace;background:#ecf2f0;padding:3px 5px;border-radius:5px}.app-footnote{margin-top:24px;color:#7a888b;font-size:11px;line-height:1.6}.fixedToast{position:fixed;right:18px;bottom:16px;background:#173e46;color:white;border-radius:12px;padding:12px 17px;z-index:999;max-width:380px;box-shadow:0 8px 30px #173e4640;font-size:13px}.mobile-nav{display:none}.cam-modal{position:fixed;inset:0;background:#102a30f2;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}.cam-card{width:min(650px,100%);background:white;border-radius:18px;padding:16px;display:grid;gap:12px}.cam-card video{width:100%;max-height:70vh;object-fit:contain;background:#142b2a;border-radius:12px}.tag{font-size:12px;color:#506f68}.question-options{display:grid;gap:8px}.question-options .opt{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:10px;border:1px solid #dfe9e5;font-size:13px}.opt.good{border-color:#84c9a5;background:#f0fbf3}.opt.bad{background:#fff1ef;border-color:#f0d2cb}.dot{width:10px;height:10px;border-radius:50%;background:#cedbd6;display:inline-block;margin-right:6px}.opt.good .dot{background:var(--good)}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.mobile-nav{position:sticky;top:0;z-index:50;background:#123942;color:white;padding:10px 17px;display:flex;align-items:center;justify-content:space-between}.mobile-nav .brand{font-size:16px;padding:0}.content{padding:25px 15px 95px}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:18px}.topbar{margin-bottom:22px}}@media(max-width:580px){.cols2{grid-template-columns:1fr}.cols3{grid-template-columns:1fr 1fr}.cols2>.card:last-child:nth-child(odd){grid-column:1/-1}.stat .value{font-size:27px}.row.mobilecolumn{align-items:stretch;flex-direction:column}.actions.mobilewide .btn{flex:1}.card{padding:16px}.table td,.table th{padding:10px 9px}}
.canvasbox.zoomed{position:fixed;inset:0;z-index:150;max-height:none;max-width:none;border-radius:0;overflow:auto;align-items:flex-start;justify-content:flex-start;padding:65px 12px 20px;background:#15333b}.canvasbox.zoomed canvas{max-width:none!important;width:800px!important;flex-shrink:0}.canvasbox.zoomed #omr-close-zoom{position:fixed;top:13px;right:17px;z-index:151;display:inline-flex!important}.canvasbox #omr-close-zoom{display:none}.canvasbox.zoomed canvas{height:auto!important}</style></head><body><div class="mobile-nav"><div class="brand"><span class="logo">✓</span>PaperMark</div><button class="btn sm" id="mobile-menu">☰ Menu</button></div><div class="shell"><aside class="side" id="aside"><div class="brand"><span class="logo">✓</span>PaperMark</div><nav id="nav"><button class="nav active" data-page="home">◫ &nbsp; Class overview</button><button class="nav" data-page="scheme">▦ &nbsp; Answer scheme</button><button class="nav" data-page="roster">☑ &nbsp; Attendance</button><button class="nav" data-page="records">▤ &nbsp; Results & export</button><button class="nav" data-page="settings">⚙ &nbsp; Settings</button></nav><div class="side-bottom">Local-first assessment workspace.<br>Student data stays on this device unless you explicitly enable a connected service.</div></aside><main class="content" id="app"><div class="card">Preparing your marking workspace…</div></main></div><div id="toastbox"></div><input class="hide" type="file" id="hidden-file"><script src="app.js"></script></body></html>
